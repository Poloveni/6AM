# ==========================================================
#  Surcouche : raccordement au Caddy deja present sur le VPS.
#
#  Le service se nomme "web" (et non "app") pour ne pas entrer en
#  conflit avec les alias reseau des autres projets : sur un reseau
#  Docker partage, chaque conteneur recoit automatiquement le nom de
#  son service comme alias. Un service nomme "app" ecraserait celui
#  d'un autre projet.
#
#  Le Caddyfile partage vise donc le nom de conteneur, sans ambiguite :
#
#      6amfbfa.duckdns.org {
#          reverse_proxy sixam-web-1:3000
#      }
#
#  Le port APP_PORT reste publie sur 127.0.0.1 uniquement : injoignable
#  depuis Internet, pratique pour un "curl localhost:PORT" de diagnostic.
#
#  Lancement (COMPOSE_FILE dans .env applique cette surcouche) :
#      docker compose --profile postgres up -d --build
# ==========================================================

services:
  web:
    networks:
      internal: {}
      vps_default: {}

networks:
  # Reseau cree par la stack Caddy ; on s'y raccroche sans le gerer.
  vps_default:
    external: true
