# ==========================================================
#  6AM — stack de production
#
#  Postgres (defaut) :
#     docker compose --profile postgres up -d --build
#  MariaDB :
#     DB_CLIENT=mysql2 DB_PORT=3306 docker compose --profile mariadb up -d --build
#
#  Toutes les variables viennent du fichier .env a la racine.
# ==========================================================

services:
  app:
    build: .
    image: sixam-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks: [web]
    volumes:
      - app_data:/app/data
    depends_on:
      db-postgres:
        condition: service_healthy
        required: false
      db-mariadb:
        condition: service_healthy
        required: false

  db-postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sixam}
      POSTGRES_USER: ${POSTGRES_USER:-sixam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      web:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sixam} -d ${POSTGRES_DB:-sixam}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-mariadb:
    image: mariadb:11
    profiles: ["mariadb"]
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-sixam}
      MARIADB_USER: ${MARIADB_USER:-sixam}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD manquant dans .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD manquant dans .env}
    volumes:
      - mariadata:/var/lib/mysql
    networks:
      web:
        aliases: [db]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks: [web]

  certbot:
    image: certbot/certbot:latest
    profiles: ["ssl"]
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

networks:
  web:

volumes:
  pgdata:
  mariadata:
  app_data:
