<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le QG — Espace membres · 6AM</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060b">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../vendor/fonts.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="qg.css">
</head>
<body class="qg-body">
<div class="grain" aria-hidden="true"></div>
<main class="qg-login">
  <a class="qg-login__back" href="../accueil.html">← Retour au site</a>
  <img class="qg-login__logo" src="../assets/logo.webp" alt="Écusson de 6AM" width="190" height="190">
  <p class="eyebrow">Espace membres</p>
  <h1>Le QG</h1>
  <p class="qg-login__lead">Réservé aux membres de 6AM. Connecte-toi avec le compte Discord qui est sur le serveur de l'organisation.</p>
  <p class="qg-login__error" id="error" role="alert" hidden></p>
  <a class="btn btn--steel btn--lg qg-login__btn" href="../auth/discord">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.4a18.3 18.3 0 0 1 4.5 2.2 15.8 15.8 0 0 0-15.4 0A18 18 0 0 1 8.8 3.4L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.5 9.3-.3 14 .1 18.7a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a13 13 0 0 1-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.4-.8-10.1-3.6-14.3ZM8 15.9c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
    Se connecter avec Discord
  </a>
  <p class="qg-login__small">Loyauté · Silence · Couronne</p>
</main>
<script src="qg-bg.js"></script>
<script>
  const msg = {
    'not-member': "Ce compte Discord n'est pas sur le serveur de 6AM. Rejoins-le d'abord, puis reviens.",
    'oauth': "Connexion Discord annulée ou expirée. Réessaie.",
    'token': "Discord n'a pas validé la connexion. Réessaie dans un instant.",
    'server': "Petit souci côté serveur. Réessaie dans un instant."
  };
  const e = new URLSearchParams(location.search).get('error');
  if (e && msg[e]) { const el = document.getElementById('error'); el.textContent = msg[e]; el.hidden = false; }
  // déjà connecté ? -> profil
  fetch('../api/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(m => { if (m) location.replace(m.status === 'approved' ? 'profil.html' : 'attente.html'); }).catch(() => {});
</script>
</body>
</html>
