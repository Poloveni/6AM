<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les membres — Le QG · 6AM</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060b">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../vendor/fonts.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="qg.css">
</head>
<body class="qg-body" data-page="membres">
<div class="grain" aria-hidden="true"></div>
<main class="qg-page qg-page--wide">
  <div class="qg-head">
    <h1>Les membres</h1>
    <p>Ceux qui portent l'écusson</p>
  </div>
  <div class="qg-loading" id="loading">Chargement…</div>
  <div class="membres-grid" id="grid"></div>
</main>
<script src="qg-bg.js"></script>
<script src="qg.js"></script>
<script>
  const $ = id => document.getElementById(id), esc = QG.esc;
  QG.me().then(() => QG.api('../api/membres')).then(list => {
    $('loading').hidden = true;
    $('grid').innerHTML = list.map(m => `
      <article class="membre" data-tier="${m.tier}">
        <img src="${esc(QG.avatar(m.avatarUrl))}" alt="" width="76" height="76" loading="lazy">
        <span class="rank-pill" data-tier="${m.tier}">${esc(m.rankLabel)}</span>
        <span class="membre__name">${esc(m.displayName)}</span>
        <span class="membre__user">@${esc(m.username)}</span>
        ${m.phoneRp ? `<span class="membre__phone">☎ ${esc(m.phoneRp)}</span>` : ''}
        ${m.bio ? `<p class="membre__bio">${esc(m.bio)}</p>` : ''}
      </article>`).join('');
  }).catch(() => {});
</script>
</body>
</html>
